name: Load shared CI build
description: Download the producer's exact build artifact and verify it against the checkout revision
inputs:
  artifact:
    description: Artifact ID from the build job in the same workflow run
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ inputs.artifact }}
        path: artifacts/ci-build
    - name: Verify and install compiled distributions
      shell: pwsh
      run: ./scripts/Sync-CiBuildArtifact.ps1 -Mode Import
