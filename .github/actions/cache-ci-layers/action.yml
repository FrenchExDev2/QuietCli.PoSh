name: Cache intermediate CI image layers
description: Restore or save BuildKit mode=max caches independently of product test success.
inputs:
  mode:
    description: restore before building; save immediately after building
    required: true
  rid:
    description: Native target architecture and libc scope
    required: true
  key:
    description: Primary BuildKit cache key selected by the workflow
    required: true
outputs:
  cache-hit:
    description: Whether the primary key was restored exactly
    value: ${{ steps.restore.outputs.cache-hit }}
  cache-primary-key:
    description: Primary cache key used during restore
    value: ${{ steps.restore.outputs.cache-primary-key }}
  restored-indexes:
    description: SHA-256 of the BuildKit indexes immediately after restore
    value: ${{ steps.enable.outputs.restored-indexes }}
runs:
  using: composite
  steps:
    - uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
      if: inputs.mode == 'restore'
      with:
        set-host: true
        daemon-config: |
          {"features":{"containerd-snapshotter":true}}
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: restore
      if: inputs.mode == 'restore'
      with:
        path: .cache/ci-buildkit
        key: ${{ inputs.key }}
        restore-keys: quietcli-buildkit-v2-${{ inputs.rid }}-
    - name: Enable the checkout-owned intermediate cache
      id: enable
      if: inputs.mode == 'restore'
      shell: pwsh
      env:
        RESTORED_INDEXES: ${{ hashFiles('.cache/ci-buildkit/*/index.json') }}
      run: |
        $encoding=[Text.UTF8Encoding]::new($false)
        $directory=[IO.Path]::Combine($env:GITHUB_WORKSPACE,'.cache/ci-buildkit')
        [IO.File]::AppendAllText($env:GITHUB_ENV,"QUIETCLI_BUILDKIT_CACHE_DIR=$directory`n",$encoding)
        [IO.File]::AppendAllText($env:GITHUB_OUTPUT,"restored-indexes=$env:RESTORED_INDEXES`n",$encoding)
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.mode == 'save'
      with:
        path: .cache/ci-buildkit
        key: ${{ inputs.key }}
