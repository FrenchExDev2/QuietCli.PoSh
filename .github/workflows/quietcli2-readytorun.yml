name: QuietCli2 ReadyToRun profiling

# Measures the same-revision IL/ReadyToRun comparison on Windows and four native Linux targets.
on:
  workflow_dispatch:
    inputs:
      aa_control:
        description: Run the A/A control before the paired comparison
        type: boolean
        default: false
  workflow_call:
    inputs:
      build_artifact:
        description: ID of the optional shared PR build with both benchmark variants
        type: string
        default: ''
      aa_control:
        description: Run the A/A control before the paired comparison
        type: boolean
        default: false
      images_prepared:
        type: boolean
        default: false
      require_complete:
        description: Require a complete comparison on every target
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  readytorun:
    name: ReadyToRun cold-start report (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cache-resources
      - uses: ./.github/actions/setup-powershell
      - name: Initialize deterministic GitHub environment
        shell: pwsh
        run: ./scripts/Initialize-CiEnvironment.ps1 -Target GitHub -ContainerRuntime docker -Confirm:$false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Verify monorepo structure and external resources
        shell: pwsh
        run: ./scripts/Initialize-Workspace.ps1 -Restore
      - name: Build the baseline module
        if: inputs.build_artifact == ''
        shell: pwsh
        run: ./scripts/Build-Workspace.ps1 -Configuration Release
      - uses: ./.github/actions/load-ci-build
        if: inputs.build_artifact != ''
        with:
          artifact: ${{ inputs.build_artifact }}
      - name: Build the ReadyToRun candidate
        shell: pwsh
        env:
          BUILD_ARTIFACT: ${{ inputs.build_artifact }}
        run: |
          $candidate = ./scripts/New-ReadyToRunCandidate.ps1 -SharedBuild:([bool]$env:BUILD_ARTIFACT) -CandidateRoot ([IO.Path]::Combine($env:RUNNER_TEMP,('quietcli-r2r-'+[guid]::NewGuid().ToString('N'))))
          "CANDIDATE_MODULE=$candidate" | Add-Content $env:GITHUB_ENV -Encoding utf8
      - name: Run the paired cold-start comparison
        id: comparison
        shell: pwsh
        env:
          CANDIDATE_MODULE: ${{ env.CANDIDATE_MODULE }}
          REQUIRE_COMPLETE: ${{ inputs.require_complete }}
          AA_CONTROL: ${{ inputs.aa_control }}
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            ./scripts/Invoke-ColdStartGate.ps1 -CandidateModule $env:CANDIDATE_MODULE -CandidateLabel readytorun -MeasurePackageSize -SkipAaControl:($env:AA_CONTROL -cne 'true')
            if (!(Get-ChildItem -LiteralPath ./artifacts/coldstart -Filter 'ab-*.json' -File)) { throw 'ReadyToRunComparisonMissing' }
          } catch {
            if ($env:REQUIRE_COMPLETE -ceq 'true') { throw }
            Write-Warning "ReadyToRun cold-start report did not complete cleanly: $_"
          }
      - name: Render the latest report
        if: always()
        shell: pwsh
        run: |
          if (Get-ChildItem ./artifacts/coldstart/ab-*.json -ErrorAction SilentlyContinue) {
            ./scripts/Show-ColdStartReport.ps1
          }
      - name: Export redacted failure diagnostics
        if: failure()
        shell: pwsh
        run: ./scripts/Export-CiFailureDiagnostics.ps1 -OutputDirectory ./artifacts/ci-failure-readytorun
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: readytorun-windows-failure-${{ github.sha }}
          path: artifacts/ci-failure-readytorun
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && (steps.comparison.outcome == 'success' || steps.comparison.outcome == 'failure') }}
        with:
          name: quietcli2-readytorun-${{ github.sha }}
          path: artifacts/coldstart
          if-no-files-found: warn
          retention-days: 30

  linux-images:
    name: Prepare ReadyToRun Linux images
    if: ${{ !inputs.images_prepared }}
    permissions: {contents: read, packages: read}
    uses: ./.github/workflows/linux-images.yml
    with:
      suites_json: '["Core"]'
      artifact_scope: readytorun

  readytorun-linux:
    needs: linux-images
    if: ${{ !cancelled() && (needs.linux-images.result == 'success' || (inputs.images_prepared && needs.linux-images.result == 'skipped')) }}
    name: ReadyToRun cold-start report (${{ matrix.platform }}, ${{ matrix.rid }})
    permissions:
      contents: read
      packages: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: debian
            rid: linux-x64
            runner: ubuntu-latest
          - platform: alpine
            rid: linux-musl-x64
            runner: ubuntu-latest
          - platform: debian
            rid: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: alpine
            rid: linux-musl-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize deterministic GitHub environment
        shell: pwsh
        run: ./scripts/Initialize-CiEnvironment.ps1 -Target GitHub -ContainerRuntime docker -Confirm:$false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'
      - uses: ./.github/actions/cache-resources
      - uses: ./.github/actions/setup-powershell
      - name: Verify monorepo structure and external resources
        shell: pwsh
        run: ./scripts/Initialize-Workspace.ps1 -Restore
      - name: Build the baseline module for every distribution
        if: inputs.build_artifact == ''
        shell: pwsh
        run: ./scripts/Build-Workspace.ps1 -Configuration Release
      - uses: ./.github/actions/load-ci-build
        if: inputs.build_artifact != ''
        with:
          artifact: ${{ inputs.build_artifact }}
      - name: Build the ReadyToRun candidate for this platform's RID
        shell: pwsh
        env:
          EXPECTED_RID: ${{ matrix.rid }}
          BUILD_ARTIFACT: ${{ inputs.build_artifact }}
        run: |
          $candidate = ./scripts/New-ReadyToRunCandidate.ps1 -SharedBuild:([bool]$env:BUILD_ARTIFACT) -RuntimeIdentifier $env:EXPECTED_RID -CandidateRoot ([IO.Path]::Combine($env:RUNNER_TEMP,('quietcli-r2r-'+[guid]::NewGuid().ToString('N'))))
          "CANDIDATE_MODULE=$candidate" | Add-Content $env:GITHUB_ENV -Encoding utf8
      - uses: ./.github/actions/load-ci-image-bundle
        id: image
        continue-on-error: ${{ !inputs.require_complete }}
        with:
          suite: Core
          rid: ${{ matrix.rid }}
          artifact_scope: ${{ inputs.images_prepared && 'workspace' || 'readytorun' }}
      - name: Run the paired cold-start comparison inside the prepared platform image
        id: comparison
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
          EXPECTED_RID: ${{ matrix.rid }}
          NATIVE_IMAGE: ${{ steps.image.outputs.image }}
          REQUIRE_COMPLETE: ${{ inputs.require_complete }}
          AA_CONTROL: ${{ inputs.aa_control }}
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            if (!$env:NATIVE_IMAGE) { throw 'ReadyToRunImageUnavailable' }
            $run = Join-Path $PWD.Path ('artifacts/coldstart-containers/'+$env:EXPECTED_RID)
            [void][IO.Directory]::CreateDirectory($run)
            ./scripts/Invoke-ContainerColdStartWorker.ps1 -WorkspaceRoot $PWD.Path -RunDirectory $run -Image $env:NATIVE_IMAGE -Platform $env:PLATFORM -CandidateModule $env:CANDIDATE_MODULE -ExpectedRuntimeIdentifier $env:EXPECTED_RID -ContainerRuntime docker -SkipAaControl:($env:AA_CONTROL -cne 'true')
            $summary=Get-Content (Join-Path $run summary.json) -Raw -Encoding utf8|ConvertFrom-Json
            if ($summary.State.State -cne 'Success') { throw ('Cold-start outcome: '+$summary.State.State+'; '+$summary.State.Error) }
            if (!(Get-ChildItem -LiteralPath $run -Filter 'ab-*.json' -File -Recurse)) { throw 'ReadyToRunComparisonMissing' }
          } catch {
            if ($env:REQUIRE_COMPLETE -ceq 'true') { throw }
            Write-Warning "ReadyToRun cold-start report did not complete cleanly: $_"
          }
      - name: Render the latest report
        if: always()
        shell: pwsh
        run: |
          $guest = Get-ChildItem ./artifacts/coldstart-containers -Filter 'guest' -Recurse -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($guest -and (Get-ChildItem (Join-Path $guest.FullName 'ab-*.json') -ErrorAction SilentlyContinue)) {
            ./scripts/Show-ColdStartReport.ps1 -ArtifactsDirectory $guest.FullName
          }
      - name: Export redacted failure diagnostics
        if: failure()
        shell: pwsh
        run: ./scripts/Export-CiFailureDiagnostics.ps1 -OutputDirectory ./artifacts/ci-failure-readytorun
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: readytorun-${{ matrix.rid }}-failure-${{ github.sha }}
          path: artifacts/ci-failure-readytorun
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && (steps.comparison.outcome == 'success' || steps.comparison.outcome == 'failure') }}
        with:
          name: quietcli2-readytorun-${{ matrix.rid }}-${{ github.sha }}
          path: artifacts/coldstart-containers
          if-no-files-found: warn
          retention-days: 30
