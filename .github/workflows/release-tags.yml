name: QuietCli module release tags
on:
  push:
    tags:
      - 'FrenchExDev2.QuietCli.Core.PoSh/v*'
      - 'FrenchExDev2.QuietCli.Git.PoSh/v*'
      - 'FrenchExDev2.QuietCli.Vagrant.PoSh/v*'
permissions:
  contents: read
concurrency:
  group: quietcli-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'FrenchExDev2/QuietCli.PoSh'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      module: ${{ steps.release.outputs.module }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate the tag, manifest version and publication capability
        id: release
        shell: pwsh
        run: ./scripts/Get-QuietReleasePlan.ps1 -Tag $env:GITHUB_REF_NAME -OutputPath $env:GITHUB_OUTPUT
  release:
    needs: plan
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-psgallery.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      publish: true
