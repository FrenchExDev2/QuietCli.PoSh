name: QuietCli repository tooling
on:
  workflow_call:
    outputs:
      functional_result:
        description: Aggregate Core independence and functional tooling job result
        value: ${{ jobs.results.outputs.functional_result }}
      mutation_result:
        description: Mutation shard execution result
        value: ${{ jobs.results.outputs.mutation_result }}
      completion_result:
        description: Exact mutation catalogue completeness result
        value: ${{ jobs.results.outputs.completion_result }}
permissions:
  contents: read
jobs:
  results:
    name: Report separate tooling qualification results
    needs: [core-independence, tooling, script-tests, run-profiles-mutation, script-mutation, mutation-complete, script-mutation-complete]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      functional_result: ${{ steps.results.outputs.functional_result }}
      mutation_result: ${{ steps.results.outputs.mutation_result }}
      completion_result: ${{ steps.results.outputs.completion_result }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Export authoritative prerequisite results even after failure
        id: results
        shell: pwsh
        env:
          TOOLING_NEEDS: ${{ toJson(needs) }}
        run: ./scripts/Write-ToolingResults.ps1 -NeedsJson $env:TOOLING_NEEDS -OutputPath $env:GITHUB_OUTPUT
  core-independence:
    name: Core builds and qualifies without the Git companion
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props
            Directory.Build.props
            global.json
      - uses: ./.github/actions/cache-resources
      - uses: ./.github/actions/setup-powershell
      - name: Verify sources and pinned resources
        shell: pwsh
        run: |
          ./scripts/Initialize-CiEnvironment.ps1 -Target GitHub -ContainerRuntime docker -Confirm:$false
          ./scripts/Initialize-Workspace.ps1 -Restore
      - name: Build only Core and run its entire suite with Git source absent
        shell: pwsh
        run: ./scripts/Test-CoreIndependence.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: quietcli-core-independence
          path: |
            artifacts/core-independence/*/independence.json
            artifacts/core-independence/*/tests/*.json
            artifacts/core-independence/*/tests/*.log
            artifacts/core-independence/*/tests/core-cases/*/*.json
            artifacts/core-independence/*/tests/core-cases/*/*.log
          if-no-files-found: error
          retention-days: 14
  tooling:
    name: Repository automation, distribution independence and run-profile behavior
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props
            Directory.Build.props
            global.json
      - uses: ./.github/actions/cache-resources
      - uses: ./.github/actions/setup-powershell
      - name: Initialize and verify the checkout
        shell: pwsh
        run: |
          ./scripts/Initialize-CiEnvironment.ps1 -Target GitHub -ContainerRuntime docker -Confirm:$false
          ./scripts/Initialize-Workspace.ps1 -Restore
          ./scripts/Build-Workspace.ps1
      - name: Qualify repository automation once
        id: tooling_tests
        shell: pwsh
        run: ./scripts/Invoke-GitHubCi.ps1 -Suite Tooling -SkipBuild -SkipTty -MaxConcurrency 2 -RunDirectory ./artifacts/tooling/tests
      - name: Qualify distribution independence without Git or another build
        id: distribution_independence
        shell: pwsh
        run: ./scripts/Test-CoreIndependence.ps1 -Suite Distribution -SkipBuild
      - name: Prepare exact profiler prerequisites for functional tooling tests
        shell: pwsh
        run: |
          $tools=./scripts/Initialize-Profilers.ps1 -Module profiler,dottrace -OutputDirectory (Join-Path $env:RUNNER_TEMP 'quietcli-profilers')
          [IO.File]::AppendAllText($env:GITHUB_ENV,"QUIETCLI_PROFILER_MODULE=$($tools.ProfilerModulePath)`nQUIETCLI_CLR_PROFILER=$($tools.ClrProfilerPath)`n",[Text.UTF8Encoding]::new($false))
      - name: Require the complete run-profile tooling suite
        id: run_profiles
        shell: pwsh
        run: ./scripts/Invoke-GitHubCi.ps1 -Suite RunProfiles -SkipBuild -MaxConcurrency 2 -RunDirectory ./artifacts/run-profiles/tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && ((steps.tooling_tests.outcome != '' && steps.tooling_tests.outcome != 'skipped') || (steps.run_profiles.outcome != '' && steps.run_profiles.outcome != 'skipped'))
        with:
          name: quietcli-tooling-${{ github.sha }}
          path: |
            artifacts/tooling/tests/*.json
            artifacts/tooling/tests/*.log
            artifacts/tooling/tests/core-cases/*/*.json
            artifacts/tooling/tests/core-cases/*/*.log
            artifacts/run-profiles/tests/*.json
            artifacts/run-profiles/tests/*.log
            artifacts/core-independence/*/independence.json
            artifacts/core-independence/*/tests/*.json
            artifacts/core-independence/*/tests/*.log
          if-no-files-found: error
          retention-days: 14
      - name: Preserve tooling fixtures only after a failed campaign
        if: failure() && (steps.tooling_tests.outcome == 'failure' || steps.run_profiles.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quietcli-failed-tooling-fixtures-${{ github.sha }}
          path: |
            artifacts/tooling
            artifacts/run-profiles/tests
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1
  run-profiles-mutation:
    name: Run-profile mutation (shard ${{ matrix.shard }}, two isolated workers)
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/cache-resources
      - uses: ./.github/actions/setup-powershell
      - name: Verify source inputs without a product build
        shell: pwsh
        run: |
          ./scripts/Initialize-CiEnvironment.ps1 -Target GitHub -ContainerRuntime docker -Confirm:$false
          ./scripts/Initialize-Workspace.ps1 -Restore
      - name: Require every run-profile tooling mutant to be detected
        id: run_profiles_mutation
        shell: pwsh
        env:
          QUIETCLI_MUTATION_SHARD_INDEX: ${{ matrix.shard }}
          QUIETCLI_MUTATION_SHARD_COUNT: 2
        run: ./scripts/Invoke-GitHubCi.ps1 -Suite RunProfilesMutation -SkipBuild -MaxConcurrency 2 -RunDirectory ./artifacts/run-profiles/mutation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.run_profiles_mutation.outcome != '' && steps.run_profiles_mutation.outcome != 'skipped'
        with:
          name: quietcli-run-profiles-mutation-${{ github.sha }}-shard${{ matrix.shard }}-attempt${{ github.run_attempt }}
          path: artifacts/run-profiles
          if-no-files-found: error
          retention-days: 14
  mutation-complete:
    name: Require the exact complete mutation catalogue
    needs: run-profiles-mutation
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: quietcli-run-profiles-mutation-${{ github.sha }}-shard*-attempt${{ github.run_attempt }}
          path: artifacts/mutation-shards
      - name: Verify all shards from this revision and attempt
        shell: pwsh
        env:
          SHARD_RESULT: ${{ needs.run-profiles-mutation.result }}
        run: |
          if($env:SHARD_RESULT -cne 'success'){throw 'MutationShardJobsRequired'}
          ./scripts/Assert-RunProfileMutationShards.ps1 -ReportRoot ./artifacts/mutation-shards -Revision $env:GITHUB_SHA -OutputPath ./artifacts/mutation-complete/receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quietcli-mutation-complete-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: artifacts/mutation-complete
          if-no-files-found: error
          retention-days: 14
  script-tests:
    # Pester 6 unit and integration tests of scripts/ and scripts/lib (test/scripts), on both host families.
    name: Script tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: ./.github/actions/cache-resources
      - uses: ./.github/actions/cache-test-tools
      - uses: ./.github/actions/setup-powershell
      - name: Initialize the checkout and the pinned test tools
        shell: pwsh
        run: |
          ./scripts/Initialize-CiEnvironment.ps1 -Target GitHub -ContainerRuntime docker -Confirm:$false
          ./scripts/Initialize-TestTools.ps1 -Confirm:$false
      - name: Run every script test with coverage
        id: script_tests
        shell: pwsh
        run: ./scripts/Invoke-ScriptsTests.ps1 -Headless -Coverage -RunDirectory ./artifacts/script-tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.script_tests.outcome != '' && steps.script_tests.outcome != 'skipped'
        with:
          name: quietcli-script-tests-${{ matrix.os }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            artifacts/script-tests/*.json
            artifacts/script-tests/*.xml
            artifacts/script-tests/*.log
          if-no-files-found: error
          retention-days: 14
  script-mutation:
    # One shard per target of test/scripts/mutation.targets.psd1; script-mutation-complete rejects a missing one.
    name: Script mutation (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        target: [ScriptsTests, ScriptAnalysis, ScriptMutation, ScriptMutationCache, ScriptMutationSlot, WorkBranch, ScriptsInventory, CiImpact, CiCompanions, CompanionWorkflows, CiPlanResults]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: ./.github/actions/cache-resources
      - uses: ./.github/actions/cache-test-tools
      - uses: ./.github/actions/setup-powershell
      - name: Initialize the checkout and the pinned test tools
        shell: pwsh
        run: |
          ./scripts/Initialize-CiEnvironment.ps1 -Target GitHub -ContainerRuntime docker -Confirm:$false
          ./scripts/Initialize-TestTools.ps1 -Tool pester -Confirm:$false
      # Outcomes are keyed by everything the target's tests can observe, so the newest cache of the target is
      # always safe to reuse; a pull request restores develop's cache but can only save into its own scope.
      - name: Restore the target's incremental mutation cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/script-mutation
          key: ${{ runner.os }}-quietcli-script-mutation-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-quietcli-script-mutation-${{ matrix.target }}-
      - name: Require the target's mutation score
        id: script_mutation
        shell: pwsh
        env:
          MUTATION_TARGET: ${{ matrix.target }}
        run: ./scripts/Invoke-ScriptsMutation.ps1 -Headless -Offline -PruneCache -Target $env:MUTATION_TARGET -ThrottleLimit 4 -TimeoutSeconds 8400 -RunDirectory ./artifacts/script-mutation/$env:MUTATION_TARGET
      # Saved even after a failed or timed-out campaign: every outcome already written stays valid for its key.
      - name: Save the target's incremental mutation cache
        if: always() && steps.script_mutation.outcome != '' && steps.script_mutation.outcome != 'skipped'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/script-mutation
          key: ${{ runner.os }}-quietcli-script-mutation-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.script_mutation.outcome != '' && steps.script_mutation.outcome != 'skipped'
        with:
          name: quietcli-script-mutation-${{ github.sha }}-${{ matrix.target }}-attempt${{ github.run_attempt }}
          path: |
            artifacts/script-mutation/*/report.json
            artifacts/script-mutation/*/report.md
            artifacts/script-mutation/*/mutants.json
          if-no-files-found: error
          retention-days: 14
  script-mutation-complete:
    name: Require every script mutation target
    needs: script-mutation
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: quietcli-script-mutation-${{ github.sha }}-*-attempt${{ github.run_attempt }}
          path: artifacts/script-mutation-shards
      - name: Verify every target from this revision and attempt
        shell: pwsh
        env:
          SHARD_RESULT: ${{ needs.script-mutation.result }}
        run: |
          if($env:SHARD_RESULT -cne 'success'){throw 'ScriptMutationShardJobsRequired'}
          ./scripts/Assert-ScriptMutationShards.ps1 -ReportRoot ./artifacts/script-mutation-shards -OutputPath ./artifacts/script-mutation-complete/receipt.json -Confirm:$false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quietcli-script-mutation-complete-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: artifacts/script-mutation-complete
          if-no-files-found: error
          retention-days: 14
