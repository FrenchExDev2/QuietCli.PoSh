name: QuietCli repository tooling
on:
  workflow_call:
    # Callers without inputs run every campaign. The companions plan passes scope scripts when only scripts/ or
    # test/scripts/ changed: then only the script test files and mutation targets those changes reach run.
    inputs:
      scope:
        description: full runs every tooling campaign; scripts runs only the selected script tests and mutation targets
        type: string
        required: false
        default: full
      script_tests:
        description: all, or a JSON array of test files relative to test/scripts
        type: string
        required: false
        default: all
      script_mutation_targets:
        description: all, or a JSON array of mutation target names from test/scripts/mutation.targets.psd1
        type: string
        required: false
        default: all
      mutation_parallel:
        description: Run mutation shards and their workers in parallel
        type: boolean
        required: false
        default: true
    outputs:
      functional_result:
        description: Aggregate Core independence and functional tooling job result
        value: ${{ jobs.results.outputs.functional_result }}
      mutation_result:
        description: Mutation shard execution result
        value: ${{ jobs.results.outputs.mutation_result }}
      completion_result:
        description: Exact mutation catalogue completeness result
        value: ${{ jobs.results.outputs.completion_result }}
permissions:
  contents: read
jobs:
  results:
    name: Report separate tooling qualification results
    needs: [core-independence, tooling, script-tests, run-profiles-mutation, script-mutation, mutation-complete, script-mutation-complete]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      functional_result: ${{ steps.results.outputs.functional_result }}
      mutation_result: ${{ steps.results.outputs.mutation_result }}
      completion_result: ${{ steps.results.outputs.completion_result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Export authoritative prerequisite results even after failure
        id: results
        shell: pwsh
        env:
          TOOLING_NEEDS: ${{ toJson(needs) }}
        run: ./scripts/Write-ToolingResults.ps1 -NeedsJson $env:TOOLING_NEEDS -OutputPath $env:GITHUB_OUTPUT
  script-selection:
    # Validates the caller's selection against the catalogues; the script jobs below read only these outputs.
    name: Select script tests and mutation targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.select.outputs.tests }}
      run_tests: ${{ steps.select.outputs.run_tests }}
      requires_build: ${{ steps.select.outputs.requires_build }}
      targets: ${{ steps.select.outputs.targets }}
      run_mutation: ${{ steps.select.outputs.run_mutation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-powershell
      - name: Expand and validate the selection
        id: select
        shell: pwsh
        env:
          TOOLING_SCOPE: ${{ inputs.scope }}
          SCRIPT_TESTS: ${{ inputs.script_tests }}
          SCRIPT_MUTATION_TARGETS: ${{ inputs.script_mutation_targets }}
        run: |
          Import-Module ./scripts/lib/ScriptsImpact.psm1 -DisableNameChecking -ErrorAction Stop
          $selection=Resolve-QuietScriptsCiSelection -WorkspaceRoot . -Scope $env:TOOLING_SCOPE -Tests $env:SCRIPT_TESTS -Targets $env:SCRIPT_MUTATION_TARGETS
          $tests=if($selection.AllTests){'all'}else{ConvertTo-Json -InputObject @($selection.TestFiles) -Compress}
          $flag={param([bool]$Value)$Value.ToString().ToLowerInvariant()}
          $values=[ordered]@{tests=$tests;run_tests=(& $flag $selection.TestFiles.Count);requires_build=(& $flag $selection.RequiresBuild);targets=(ConvertTo-Json -InputObject @($selection.MutationTargets) -Compress);run_mutation=(& $flag $selection.MutationTargets.Count)}
          foreach($key in $values.Keys){[IO.File]::AppendAllText($env:GITHUB_OUTPUT,$key+'='+$values[$key]+"`n",[Text.UTF8Encoding]::new($false))}
  core-independence:
    name: Core builds and qualifies without the Git companion
    if: inputs.scope == 'full'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props
            Directory.Build.props
            global.json
      - uses: ./.github/actions/cache-resources
      - uses: ./.github/actions/setup-powershell
      - name: Verify sources and pinned resources
        shell: pwsh
        run: |
          ./scripts/Initialize-CiEnvironment.ps1 -Target GitHub -ContainerRuntime docker -Confirm:$false
          ./scripts/Initialize-Workspace.ps1 -Restore
      - name: Build only Core and run its entire suite with Git source absent
        shell: pwsh
        run: ./scripts/Test-CoreIndependence.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quietcli-core-independence
          path: |
            artifacts/core-independence/*/independence.json
            artifacts/core-independence/*/tests/*.json
            artifacts/core-independence/*/tests/*.log
            artifacts/core-independence/*/tests/core-cases/*/*.json
            artifacts/core-independence/*/tests/core-cases/*/*.log
          if-no-files-found: error
          retention-days: 14
  tooling:
    name: Repository automation, distribution independence and run-profile behavior
    if: inputs.scope == 'full'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props
            Directory.Build.props
            global.json
      - uses: ./.github/actions/cache-resources
      - uses: ./.github/actions/setup-powershell
      - name: Initialize and verify the checkout
        shell: pwsh
        run: |
          ./scripts/Initialize-CiEnvironment.ps1 -Target GitHub -ContainerRuntime docker -Confirm:$false
          ./scripts/Initialize-Workspace.ps1 -Restore
          ./scripts/Build-Workspace.ps1
      - name: Qualify repository automation once
        id: tooling_tests
        shell: pwsh
        run: ./scripts/Invoke-GitHubCi.ps1 -Suite Tooling -SkipBuild -SkipTty -MaxConcurrency 2 -RunDirectory ./artifacts/tooling/tests
      - name: Qualify distribution independence without Git or another build
        id: distribution_independence
        shell: pwsh
        run: ./scripts/Test-CoreIndependence.ps1 -Suite Distribution -SkipBuild
      - name: Prepare exact profiler prerequisites for functional tooling tests
        shell: pwsh
        run: |
          $tools=./scripts/Initialize-Profilers.ps1 -Module profiler,dottrace -OutputDirectory (Join-Path $env:RUNNER_TEMP 'quietcli-profilers')
          [IO.File]::AppendAllText($env:GITHUB_ENV,"QUIETCLI_PROFILER_MODULE=$($tools.ProfilerModulePath)`nQUIETCLI_CLR_PROFILER=$($tools.ClrProfilerPath)`n",[Text.UTF8Encoding]::new($false))
      - name: Require the complete run-profile tooling suite
        id: run_profiles
        shell: pwsh
        run: ./scripts/Invoke-GitHubCi.ps1 -Suite RunProfiles -SkipBuild -MaxConcurrency 2 -RunDirectory ./artifacts/run-profiles/tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && ((steps.tooling_tests.outcome != '' && steps.tooling_tests.outcome != 'skipped') || (steps.run_profiles.outcome != '' && steps.run_profiles.outcome != 'skipped'))
        with:
          name: quietcli-tooling-${{ github.sha }}
          path: |
            artifacts/tooling/tests/*.json
            artifacts/tooling/tests/*.log
            artifacts/tooling/tests/core-cases/*/*.json
            artifacts/tooling/tests/core-cases/*/*.log
            artifacts/run-profiles/tests/*.json
            artifacts/run-profiles/tests/*.log
            artifacts/core-independence/*/independence.json
            artifacts/core-independence/*/tests/*.json
            artifacts/core-independence/*/tests/*.log
          if-no-files-found: error
          retention-days: 14
      - name: Preserve tooling fixtures only after a failed campaign
        if: failure() && (steps.tooling_tests.outcome == 'failure' || steps.run_profiles.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quietcli-failed-tooling-fixtures-${{ github.sha }}
          path: |
            artifacts/tooling
            artifacts/run-profiles/tests
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1
  run-profiles-mutation:
    name: Run-profile mutation (shard ${{ matrix.shard }}, two isolated workers)
    if: inputs.scope == 'full'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.mutation_parallel && 2 || 1 }}
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cache-resources
      - uses: ./.github/actions/setup-powershell
      - name: Verify source inputs without a product build
        shell: pwsh
        run: |
          ./scripts/Initialize-CiEnvironment.ps1 -Target GitHub -ContainerRuntime docker -Confirm:$false
          ./scripts/Initialize-Workspace.ps1 -Restore
      - name: Require every run-profile tooling mutant to be detected
        id: run_profiles_mutation
        shell: pwsh
        env:
          QUIETCLI_MUTATION_SHARD_INDEX: ${{ matrix.shard }}
          QUIETCLI_MUTATION_SHARD_COUNT: 2
          MUTATION_WORKERS: ${{ inputs.mutation_parallel && 2 || 1 }}
        run: ./scripts/Invoke-GitHubCi.ps1 -Suite RunProfilesMutation -SkipBuild -MaxConcurrency ([int]$env:MUTATION_WORKERS) -RunDirectory ./artifacts/run-profiles/mutation
      - name: Render run-profile mutation results
        if: always() && steps.run_profiles_mutation.outcome != '' && steps.run_profiles_mutation.outcome != 'skipped'
        shell: pwsh
        env:
          CAMPAIGN_OUTCOME: ${{ steps.run_profiles_mutation.outcome }}
        run: ./scripts/Export-CampaignReport.ps1 -Kind RunProfilesMutation -Title 'Run-profile mutation' -Outcome $env:CAMPAIGN_OUTCOME -Directory ./artifacts/run-profiles/mutation -SummaryPath $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.run_profiles_mutation.outcome != '' && steps.run_profiles_mutation.outcome != 'skipped'
        with:
          name: quietcli-run-profiles-mutation-${{ github.sha }}-shard${{ matrix.shard }}-attempt${{ github.run_attempt }}
          path: artifacts/run-profiles
          if-no-files-found: error
          retention-days: 14
  mutation-complete:
    name: Require the exact complete mutation catalogue
    needs: run-profiles-mutation
    if: ${{ always() && !cancelled() && inputs.scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: quietcli-run-profiles-mutation-${{ github.sha }}-shard*-attempt${{ github.run_attempt }}
          path: artifacts/mutation-shards
      - name: Verify all shards from this revision and attempt
        shell: pwsh
        env:
          SHARD_RESULT: ${{ needs.run-profiles-mutation.result }}
        run: |
          if($env:SHARD_RESULT -cne 'success'){throw 'MutationShardJobsRequired'}
          ./scripts/Assert-RunProfileMutationShards.ps1 -ReportRoot ./artifacts/mutation-shards -Revision $env:GITHUB_SHA -OutputPath ./artifacts/mutation-complete/receipt.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quietcli-mutation-complete-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: artifacts/mutation-complete
          if-no-files-found: error
          retention-days: 14
  script-tests:
    # Pester 6 unit and integration tests of scripts/ and scripts/lib (test/scripts), on both host families.
    name: Script tests (${{ matrix.os }})
    needs: script-selection
    if: needs.script-selection.outputs.run_tests == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props
            Directory.Build.props
            global.json
      - uses: ./.github/actions/cache-resources
      - uses: ./.github/actions/cache-test-tools
      - uses: ./.github/actions/setup-powershell
      - name: Initialize the checkout and the pinned test tools
        shell: pwsh
        run: |
          ./scripts/Initialize-CiEnvironment.ps1 -Target GitHub -ContainerRuntime docker -Confirm:$false
          ./scripts/Initialize-TestTools.ps1 -Confirm:$false
      - name: Build Core and Git for the entry points that run quiet git
        # Start-QuietWorkBranch.ps1 drives git through quiet, which needs the built engine; its tests declare it.
        if: needs.script-selection.outputs.requires_build == 'true'
        shell: pwsh
        run: |
          ./scripts/Initialize-Workspace.ps1 -Restore
          ./scripts/Build-Workspace.ps1 -Suite Git
      # Every test runs once with the global coverage threshold; a selection is a partial run, so it skips coverage.
      - name: Run the selected script tests
        id: script_tests
        shell: pwsh
        env:
          SCRIPT_TESTS: ${{ needs.script-selection.outputs.tests }}
        run: |
          if($env:SCRIPT_TESTS -ceq 'all'){./scripts/Invoke-ScriptsTests.ps1 -Headless -Coverage -RunDirectory ./artifacts/script-tests}
          else{./scripts/Invoke-ScriptsTests.ps1 -Headless -Path ([string[]](ConvertFrom-Json $env:SCRIPT_TESTS)) -RunDirectory ./artifacts/script-tests}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.script_tests.outcome != '' && steps.script_tests.outcome != 'skipped'
        with:
          name: quietcli-script-tests-${{ matrix.os }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            artifacts/script-tests/*.json
            artifacts/script-tests/*.xml
            artifacts/script-tests/*.log
          if-no-files-found: error
          retention-days: 14
  script-mutation:
    # One shard per selected target of test/scripts/mutation.targets.psd1; script-mutation-complete rejects a missing one.
    name: Script mutation (${{ matrix.target }})
    needs: script-selection
    if: needs.script-selection.outputs.run_mutation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.mutation_parallel && 8 || 1 }}
      matrix:
        target: ${{ fromJson(needs.script-selection.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: ./.github/actions/cache-resources
      - uses: ./.github/actions/cache-test-tools
      - uses: ./.github/actions/setup-powershell
      - name: Initialize the checkout and the pinned test tools
        shell: pwsh
        run: |
          ./scripts/Initialize-CiEnvironment.ps1 -Target GitHub -ContainerRuntime docker -Confirm:$false
          ./scripts/Initialize-TestTools.ps1 -Tool pester -Confirm:$false
      # Outcomes are keyed by everything the target's tests can observe, so the newest cache of the target is
      # always safe to reuse; a pull request restores develop's cache but can only save into its own scope.
      - name: Restore the target's incremental mutation cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/script-mutation
          key: ${{ runner.os }}-quietcli-script-mutation-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-quietcli-script-mutation-${{ matrix.target }}-
      - name: Require the target's mutation score
        id: script_mutation
        shell: pwsh
        env:
          MUTATION_TARGET: ${{ matrix.target }}
          MUTATION_WORKERS: ${{ inputs.mutation_parallel && 4 || 1 }}
        run: ./scripts/Invoke-ScriptsMutation.ps1 -Headless -Offline -PruneCache -Target $env:MUTATION_TARGET -ThrottleLimit ([int]$env:MUTATION_WORKERS) -TimeoutSeconds 8400 -RunDirectory ./artifacts/script-mutation/$env:MUTATION_TARGET
      - name: Render script mutation results
        if: always() && steps.script_mutation.outcome != '' && steps.script_mutation.outcome != 'skipped'
        shell: pwsh
        env:
          MUTATION_TARGET: ${{ matrix.target }}
          CAMPAIGN_OUTCOME: ${{ steps.script_mutation.outcome }}
        run: ./scripts/Export-CampaignReport.ps1 -Kind ScriptMutation -Title "Script mutation $env:MUTATION_TARGET" -Outcome $env:CAMPAIGN_OUTCOME -Directory ./artifacts/script-mutation/$env:MUTATION_TARGET -SummaryPath $env:GITHUB_STEP_SUMMARY
      # Saved even after a failed or timed-out campaign: every outcome already written stays valid for its key.
      - name: Save the target's incremental mutation cache
        if: always() && steps.script_mutation.outcome != '' && steps.script_mutation.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/script-mutation
          key: ${{ runner.os }}-quietcli-script-mutation-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.script_mutation.outcome != '' && steps.script_mutation.outcome != 'skipped'
        with:
          name: quietcli-script-mutation-${{ github.sha }}-${{ matrix.target }}-attempt${{ github.run_attempt }}
          path: |
            artifacts/script-mutation/*/report.json
            artifacts/script-mutation/*/report.md
            artifacts/script-mutation/*/report.html
            artifacts/script-mutation/*/mutants.json
          if-no-files-found: error
          retention-days: 14
  script-mutation-complete:
    name: Require every script mutation target
    needs: [script-selection, script-mutation]
    # Runs unless the selection succeeded with no target, so a failed selection still fails the campaign here.
    if: ${{ always() && !cancelled() && needs.script-selection.outputs.run_mutation != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: quietcli-script-mutation-${{ github.sha }}-*-attempt${{ github.run_attempt }}
          path: artifacts/script-mutation-shards
      - name: Verify every selected target from this revision and attempt
        shell: pwsh
        env:
          SHARD_RESULT: ${{ needs.script-mutation.result }}
          MUTATION_TARGETS: ${{ needs.script-selection.outputs.targets }}
        run: |
          if($env:SHARD_RESULT -cne 'success'){throw 'ScriptMutationShardJobsRequired'}
          ./scripts/Assert-ScriptMutationShards.ps1 -ReportRoot ./artifacts/script-mutation-shards -Target ([string[]](ConvertFrom-Json $env:MUTATION_TARGETS)) -OutputPath ./artifacts/script-mutation-complete/receipt.json -Confirm:$false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quietcli-script-mutation-complete-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: artifacts/script-mutation-complete
          if-no-files-found: error
          retention-days: 14
