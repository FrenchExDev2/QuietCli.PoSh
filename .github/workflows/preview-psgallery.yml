name: QuietCli2 manual develop preview
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish publicly after full qualification; false prepares artifacts only
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  packages: write
jobs:
  preview:
    if: ${{ github.repository == 'FrenchExDev2/QuietCli.PoSh' && github.ref == 'refs/heads/develop' }}
    uses: ./.github/workflows/publish-psgallery.yml
    with:
      preview_build: true
      publish: ${{ inputs.publish == true }}
