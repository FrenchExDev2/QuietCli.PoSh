name: QuietCli2 manual preview artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  preview:
    if: ${{ github.repository == 'FrenchExDev2/QuietCli.PoSh' && github.ref == 'refs/heads/develop' }}
    uses: ./.github/workflows/publish-psgallery.yml
    with:
      preview_build: true
      publish: false
