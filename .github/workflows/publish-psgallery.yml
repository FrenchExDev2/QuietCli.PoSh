name: QuietCli2 qualified PowerShell Gallery release
on:
  workflow_call:
    inputs:
      version:
        description: Exact manifest version for a manually selected release
        type: string
        default: ''
      preview_build:
        description: Generate a preview identity in staged manifests only
        type: boolean
        default: false
      publish:
        description: Publish the verified packages publicly after qualification
        type: boolean
        default: false
    outputs:
      version:
        description: Exact prepared package identity
        value: ${{ jobs.package.outputs.version }}
  workflow_dispatch:
    inputs:
      version:
        description: Exact version of both source manifests, for example 0.2.0-preview
        required: true
        type: string
      publish:
        description: Publish publicly to PSGallery; false only prepares and validates artifacts
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: quietcli2-psgallery
  cancel-in-progress: false
jobs:
  qualification:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci.yml
    with:
      suite: All
  package:
    needs: qualification
    if: ${{ needs.qualification.result == 'success' && needs.qualification.outputs.qualified_sha == github.sha }}
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.plan.outputs.version }}
      artifact_name: ${{ steps.plan.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.qualification.outputs.qualified_sha }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 11.0.100-rc.3.26522.148
          cache: true
          cache-dependency-path: '**/*.csproj'
      - uses: ./.github/actions/cache-resources
      - name: Verify the qualified source lock
        shell: pwsh
        run: ./scripts/Initialize-Workspace.ps1 -Restore
      - name: Select the checksum-pinned stable PowerShell host
        shell: pwsh
        run: |
          $selected=./scripts/Initialize-PowerShellHost.ps1 -Channel stable -RuntimeIdentifier win-x64 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'quietcli-package-host')
          [void][IO.File]::AppendAllTextAsync($env:GITHUB_PATH,($selected.Directory+"`n"),[Text.UTF8Encoding]::new($false)).GetAwaiter().GetResult()
      - name: Build all embedded engine distributions
        shell: pwsh
        run: |
          . ./scripts/RuntimeTargets.ps1
          ./scripts/Build-Workspace.ps1 -Configuration Release -ReadyToRun -ReadyToRunRuntimeIdentifier @((Get-QuietRuntimeTargets $PWD.Path).Rid)
      - name: Verify the exact build being packaged
        shell: pwsh
        run: ./scripts/Invoke-GitHubCi.ps1 -Suite All -SkipBuild -SkipTty -ExpectedRuntimeIdentifier win-x64
      - name: Prepare and validate the unchanged publication artifacts
        id: plan
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PREVIEW_BUILD: ${{ inputs.preview_build }}
          QUALIFIED_REVISION: ${{ needs.qualification.outputs.qualified_sha }}
        run: |
          if($env:PREVIEW_BUILD -eq 'true'){
            ./scripts/New-QuietPreviewPackage.ps1 -OutputDirectory ./artifacts/gallery -BuildNumber $env:GITHUB_RUN_NUMBER -Attempt $env:GITHUB_RUN_ATTEMPT -QualifiedRevision $env:QUALIFIED_REVISION -RequireReadyToRun
          }else{
            if([string]::IsNullOrWhiteSpace($env:RELEASE_VERSION)){throw 'ExactReleaseVersionRequired'}
            ./scripts/New-QuietGalleryPackage.ps1 -OutputDirectory ./artifacts/gallery -Version $env:RELEASE_VERSION -RequireReadyToRun
            ./scripts/Publish-QuietGallery.ps1 -PackageDirectory ./artifacts/gallery -Version $env:RELEASE_VERSION -ValidateOnly
          }
          $plan=Get-Content ./artifacts/gallery/package-set.json -Raw -Encoding utf8|ConvertFrom-Json
          $artifact='quietcli2-gallery-'+$plan.Version+'-'+$env:GITHUB_SHA+'-attempt'+$env:GITHUB_RUN_ATTEMPT
          $output="version=$($plan.Version)`nartifact_name=$artifact`n"
          [void][IO.File]::AppendAllTextAsync($env:GITHUB_OUTPUT,$output,[Text.UTF8Encoding]::new($false)).GetAwaiter().GetResult()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.plan.outputs.artifact_name }}
          path: |
            artifacts/gallery/*.nupkg
            artifacts/gallery/package-set.json
            artifacts/gallery/preview.json
          if-no-files-found: error
          retention-days: 30
      - name: Require preview properties, offline installation and targeted mutations
        if: inputs.preview_build == true
        shell: pwsh
        run: ./scripts/Invoke-GitHubCi.ps1 -Suite GalleryPreview -SkipBuild -RunDirectory ./artifacts/preview-qualification -TimeoutSeconds 600
      - name: Prepare bounded redacted package failure diagnostics
        if: failure()
        shell: pwsh
        env:
          QUIETCLI_DIAGNOSTIC_TOKEN: ${{ github.token }}
        run: ./scripts/Export-CiFailureDiagnostics.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: quietcli2-package-diagnostics-${{ github.run_attempt }}
          path: artifacts/failure-diagnostics
          if-no-files-found: warn
          retention-days: 14
  publish:
    needs: [qualification, package]
    if: ${{ inputs.publish == true && github.repository == 'FrenchExDev2/QuietCli.PoSh' && needs.qualification.result == 'success' && needs.qualification.outputs.qualified_sha == github.sha }}
    runs-on: windows-latest
    timeout-minutes: 10
    environment: psgallery
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.qualification.outputs.qualified_sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: artifacts/gallery
      - name: Select the checksum-pinned stable PowerShell host
        shell: pwsh
        run: |
          $selected=./scripts/Initialize-PowerShellHost.ps1 -Channel stable -RuntimeIdentifier win-x64 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'quietcli-publish-host')
          [void][IO.File]::AppendAllTextAsync($env:GITHUB_PATH,($selected.Directory+"`n"),[Text.UTF8Encoding]::new($false)).GetAwaiter().GetResult()
      - name: Validate the exact downloaded package set
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: ./scripts/Publish-QuietGallery.ps1 -PackageDirectory ./artifacts/gallery -Version $env:RELEASE_VERSION -ValidateOnly
      - name: Validate the prepared preview against its qualified checkpoint
        if: inputs.preview_build == true
        shell: pwsh
        env:
          QUALIFIED_REVISION: ${{ needs.qualification.outputs.qualified_sha }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          if($env:GITHUB_REF -cne 'refs/heads/develop'){throw 'PreviewPublicationRequiresDevelop'}
          ./scripts/Assert-GalleryCheckpoint.ps1 -PackageDirectory ./artifacts/gallery -QualifiedRevision $env:QUALIFIED_REVISION -Version $env:RELEASE_VERSION
      - name: Publish the verified packages, Core only
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: ./scripts/Publish-QuietGallery.ps1 -PackageDirectory ./artifacts/gallery -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: quietcli2-publication-${{ needs.package.outputs.version }}-attempt${{ github.run_attempt }}
          path: artifacts/gallery/publication.json
          if-no-files-found: ignore
