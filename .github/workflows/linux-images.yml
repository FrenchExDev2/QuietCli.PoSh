name: Prepare native Linux CI images
on:
  workflow_call:
    inputs:
      suites_json:
        type: string
        required: true
      artifact_scope:
        type: string
        required: true
      publish_cache:
        type: boolean
        default: false
      images_only:
        type: boolean
        default: false
jobs:
  prepare:
    name: Prepare Linux images (${{ matrix.rid }})
    concurrency:
      group: ${{ inputs.publish_cache && format('quietcli2-ci-images-{0}', matrix.rid) || format('quietcli2-ci-images-{0}-{1}-{2}', github.run_id, inputs.artifact_scope, matrix.rid) }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - {rid: linux-x64, runner: ubuntu-latest}
          - {rid: linux-musl-x64, runner: ubuntu-latest}
          - {rid: linux-arm64, runner: ubuntu-24.04-arm}
          - {rid: linux-musl-arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Initialize deterministic GitHub environment
        shell: pwsh
        run: ./scripts/Initialize-CiEnvironment.ps1 -Target GitHub -ContainerRuntime docker -Confirm:$false
      - uses: ./.github/actions/setup-powershell
      - name: Fingerprint the selected image chains
        id: image_key
        if: ${{ !inputs.images_only }}
        shell: pwsh
        env:
          IMAGE_SUITES: ${{ inputs.suites_json }}
          IMAGE_RID: ${{ matrix.rid }}
        run: |
          $key=./scripts/Export-CiImageBundle.ps1 -Suite ([string[]](ConvertFrom-Json $env:IMAGE_SUITES)) -RuntimeIdentifier $env:IMAGE_RID -CacheKey
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT,"fingerprint=$key`n",[Text.UTF8Encoding]::new($false))
      - name: Restore the exact final image archive
        id: image_cache
        if: ${{ !inputs.images_only }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/prepared-ci-images
          key: quietcli-ci-archive-v1-${{ matrix.rid }}-${{ steps.image_key.outputs.fingerprint }}
      - uses: ./.github/actions/cache-ci-layers
        if: ${{ inputs.images_only || steps.image_cache.outputs.cache-hit != 'true' }}
        with:
          mode: restore
          rid: ${{ matrix.rid }}
          fingerprint: ${{ hashFiles('build/ci-images.lock.json', 'build/companions.yaml', 'global.json', '.github/containers/**', 'src/**/ci/**', 'scripts/lib/CiImages.psm1') }}
      - name: Prepare and archive the selected image chains
        if: ${{ !inputs.images_only && steps.image_cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        env:
          IMAGE_SUITES: ${{ inputs.suites_json }}
          IMAGE_RID: ${{ matrix.rid }}
          PUBLISH_CACHE: ${{ inputs.publish_cache }}
          QUIETCLI_REGISTRY_TOKEN: ${{ github.token }}
        run: ./scripts/Export-CiImageBundle.ps1 -Suite ([string[]](ConvertFrom-Json $env:IMAGE_SUITES)) -RuntimeIdentifier $env:IMAGE_RID -OutputDirectory ./artifacts/prepared-ci-images -Revision $env:GITHUB_SHA -RunId $env:GITHUB_RUN_ID -PublishCache:($env:PUBLISH_CACHE -ceq 'true')
      - name: Verify the cached archive for this run
        if: ${{ !inputs.images_only && steps.image_cache.outputs.cache-hit == 'true' }}
        shell: pwsh
        env:
          IMAGE_SUITES: ${{ inputs.suites_json }}
          IMAGE_RID: ${{ matrix.rid }}
        run: ./scripts/Export-CiImageBundle.ps1 -Suite ([string[]](ConvertFrom-Json $env:IMAGE_SUITES)) -RuntimeIdentifier $env:IMAGE_RID -OutputDirectory ./artifacts/prepared-ci-images -Revision $env:GITHUB_SHA -RunId $env:GITHUB_RUN_ID -ReuseArchive
      - name: Warm only the trusted cache
        if: ${{ inputs.images_only }}
        shell: pwsh
        env:
          IMAGE_SUITES: ${{ inputs.suites_json }}
          IMAGE_RID: ${{ matrix.rid }}
          QUIETCLI_REGISTRY_TOKEN: ${{ github.token }}
        run: ./scripts/New-CiSuiteImage.ps1 -Suite ([string[]](ConvertFrom-Json $env:IMAGE_SUITES)) -RuntimeIdentifier $env:IMAGE_RID -RegistryCache -PublishCache -ResolveOnly -ContainerRuntime docker
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !inputs.images_only }}
        with:
          name: quietcli-prepared-images-${{ inputs.artifact_scope }}-${{ matrix.rid }}
          path: artifacts/prepared-ci-images
          overwrite: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
      - name: Save the exact final image archive
        if: ${{ !inputs.images_only && steps.image_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/prepared-ci-images
          key: ${{ steps.image_cache.outputs.cache-primary-key }}
      - uses: ./.github/actions/cache-ci-layers
        if: ${{ always() && !cancelled() && (inputs.images_only || steps.image_cache.outputs.cache-hit != 'true') }}
        with:
          mode: save
          rid: ${{ matrix.rid }}
          fingerprint: ${{ hashFiles('build/ci-images.lock.json', 'build/companions.yaml', 'global.json', '.github/containers/**', 'src/**/ci/**', 'scripts/lib/CiImages.psm1') }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quietcli-ci-image-receipts-${{ inputs.artifact_scope }}-${{ matrix.rid }}-attempt${{ github.run_attempt }}
          path: artifacts/ci-images
          if-no-files-found: ignore
          retention-days: 14
