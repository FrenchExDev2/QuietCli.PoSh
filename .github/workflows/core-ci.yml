name: QuietCli2 Core
on:
  pull_request:
    paths: &core_paths
      - 'FrenchExDev2.QuietCli.Core.PoSh/**'
      - 'FrenchExDev2.QuietCli.Core.Tests.PoSh/**'
      - 'scripts/**'
      - 'build/**'
      - '.github/**'
      - 'global.json'
      - 'Quietly.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'AGENTS.md'
      - '.gitattributes'
  push:
    branches: [develop]
    paths: *core_paths
permissions:
  contents: read
jobs:
  core:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci.yml
    with:
      suite: Core
