name: QuietCli2 Companions
on:
  pull_request:
    paths: &companion_paths
      - 'FrenchExDev2.QuietCli.*.PoSh/**'
      - 'scripts/**'
      - 'build/**'
      - '.github/**'
      - 'global.json'
      - 'Quietly.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'AGENTS.md'
      - '.gitattributes'
  push:
    branches: [develop]
    paths: *companion_paths
permissions:
  contents: read
concurrency:
  group: quietcli-companions-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  companions:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci.yml
    with:
      suite: All
      collect_performance: true
  preview:
    needs: companions
    if: github.event_name == 'push' && github.repository == 'FrenchExDev2/QuietCli.PoSh' && github.ref == 'refs/heads/develop' && needs.companions.outputs.qualified_sha == github.sha
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-psgallery.yml
    with:
      qualified_sha: ${{ needs.companions.outputs.qualified_sha }}
      preview_build: true
      publish: true
