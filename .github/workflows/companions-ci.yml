name: QuietCli2 Companions
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [develop]
  # A pull request or a push selects work from its diff; repository scripts select only the script tests and
  # mutation targets they reach. This manual run qualifies chosen companions in full on any branch, Tooling for the
  # whole repository tooling, for example after a change to qualification scripts.
  workflow_dispatch:
    inputs:
      suites:
        description: Companions to qualify in full, comma-separated (for example Core,Git), Tooling, or all
        type: string
        required: false
        default: all
permissions: {contents: read, actions: read, pull-requests: read}
concurrency:
  group: quietcli-companions-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source-checks:
    name: Check PowerShell sources before expensive campaigns
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Validate sources without importing product modules
        shell: pwsh
        run: ./scripts/Invoke-WorkspaceChecks.ps1 -Check PowerShellSources
  plan:
    name: Explain affected projects and select companion work
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      image_suites: ${{ steps.plan.outputs.image_suites }}
      smoke_suites: ${{ steps.plan.outputs.smoke_suites }}
      run_products: ${{ steps.plan.outputs.run_products }}
      run_smokes: ${{ steps.plan.outputs.run_smokes }}
      run_tooling: ${{ steps.plan.outputs.run_tooling }}
      run_distribution: ${{ steps.plan.outputs.run_distribution }}
      run_readytorun: ${{ steps.plan.outputs.run_readytorun }}
      renew_image_caches: ${{ steps.plan.outputs.renew_image_caches }}
      companion_checks: ${{ steps.plan.outputs.companion_checks }}
      run_companion_checks: ${{ steps.plan.outputs.run_companion_checks }}
      mutation_parallel: ${{ steps.plan.outputs.mutation_parallel }}
      script_mutation_no_input_cache: ${{ steps.plan.outputs.script_mutation_no_input_cache }}
      pr_ci_options: ${{ steps.plan.outputs.pr_ci_options }}
      pr_number: ${{ steps.plan.outputs.pr_number }}
      pr_head: ${{ steps.plan.outputs.pr_head }}
      pr_base: ${{ steps.plan.outputs.pr_base }}
      run_layout: ${{ steps.plan.outputs.run_layout }}
      tooling_scope: ${{ steps.plan.outputs.tooling_scope }}
      script_tests: ${{ steps.plan.outputs.script_tests }}
      script_mutation_targets: ${{ steps.plan.outputs.script_mutation_targets }}
      run_shared_build: ${{ steps.plan.outputs.run_shared_build }}
      tooling_requires_build: ${{ steps.plan.outputs.tooling_requires_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: ./.github/actions/cache-resources
      - uses: ./.github/actions/setup-powershell
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Read complete diff, project references and central packages
        # MSBuild evaluation is used only for imports and property-based references.
        id: plan
        shell: pwsh
        env:
          DISPATCH_SUITES: ${{ inputs.suites }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Invoke-GitHubCiPlan.ps1 -Suite $env:DISPATCH_SUITES
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: {name: quietcli-ci-plan, path: artifacts/ci-plan, retention-days: 14}
  layout-tests:
    name: Verify generated layout and selective planning
    # Skipped only when script tests are the whole plan; scripts-docs-check still runs every workspace check.
    needs: plan
    if: needs.plan.outputs.run_layout == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/cache-resources
      - uses: ./.github/actions/setup-powershell
      - name: Verify generated solutions and companion workflows
        shell: pwsh
        run: ./scripts/Invoke-WorkspaceChecks.ps1 -Check WorkspaceSolutions,CompanionWorkflows
      - name: Run layout, property, malformed-input and mutation checks
        shell: pwsh
        run: ./scripts/Invoke-WorkspaceCi.ps1 -Suite WorkspaceLayout -SkipBuild -Headless -TimeoutSeconds 600 -RunDirectory ./artifacts/layout-tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: {name: quietcli-layout-tests, path: artifacts/layout-tests}
  build:
    name: Build shared PR distributions
    needs: [plan, source-checks]
    if: github.event_name == 'pull_request' && needs.plan.outputs.run_shared_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 35
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup-powershell
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: build_cache
        with:
          path: artifacts/ci-build
          key: quietcli-pr-build-v1-${{ github.sha }}-${{ needs.plan.outputs.run_products }}-${{ needs.plan.outputs.run_readytorun }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: steps.build_cache.outputs.cache-hit != 'true'
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props
            Directory.Build.props
            global.json
      - uses: ./.github/actions/cache-resources
        if: steps.build_cache.outputs.cache-hit != 'true'
      - name: Compile the solution and prepare the selected engine variants
        if: steps.build_cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          PRODUCTS: ${{ needs.plan.outputs.run_products }}
          BASELINE: ${{ needs.plan.outputs.run_readytorun }}
        run: |
          ./scripts/Initialize-CiEnvironment.ps1 -Target GitHub -ContainerRuntime docker -Confirm:$false
          ./scripts/Initialize-Workspace.ps1 -Restore
          $parameters=@{Configuration='Release'}
          if($env:PRODUCTS -ceq 'true' -or $env:BASELINE -ceq 'true'){
            Import-Module ./scripts/lib/RuntimeTargets.psm1 -DisableNameChecking -ErrorAction Stop
            $parameters.ReadyToRun=$true
            $parameters.ReadyToRunRuntimeIdentifier=@((Get-QuietRuntimeTargets $PWD.Path).Rid)
          }
          if($env:BASELINE -ceq 'true'){$parameters.ReadyToRunBaselineDirectory='artifacts/ci-build-baseline'}
          ./scripts/Build-Workspace.ps1 @parameters
          ./scripts/Sync-CiBuildArtifact.ps1 -Mode Export -Baseline:($env:BASELINE -ceq 'true')
      - name: Verify the revision and archive checksum
        shell: pwsh
        run: ./scripts/Sync-CiBuildArtifact.ps1 -Mode Verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: quietcli-pr-build-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: artifacts/ci-build
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.build_cache.outputs.cache-hit != 'true'
        with:
          path: artifacts/ci-build
          key: ${{ steps.build_cache.outputs.cache-primary-key }}
  images:
    name: Prepare shared Linux images
    needs: [plan, source-checks]
    if: needs.plan.outputs.run_products == 'true' || needs.plan.outputs.run_readytorun == 'true' || needs.plan.outputs.renew_image_caches == 'true'
    permissions: {contents: read, packages: write}
    uses: ./.github/workflows/linux-images.yml
    with:
      suites_json: ${{ needs.plan.outputs.image_suites }}
      artifact_scope: workspace
      renew_cache: ${{ needs.plan.outputs.renew_image_caches == 'true' }}
      publish_cache: ${{ github.repository == 'FrenchExDev2/QuietCli.PoSh' && github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
  products:
    name: Qualify ${{ matrix.suite }}
    needs: [plan, source-checks, layout-tests, images, build]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.source-checks.result == 'success' && needs.layout-tests.result == 'success' && needs.images.result == 'success' && needs.plan.outputs.run_products == 'true' && (github.event_name != 'pull_request' || needs.build.outputs.artifact != '') }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    permissions: {contents: read, packages: write}
    uses: ./.github/workflows/ci.yml
    with:
      suite: ${{ matrix.suite }}
      qualification_mode: full
      solution_path: ${{ matrix.solution_path }}
      source_path: ${{ matrix.source_path }}
      test_path: ${{ matrix.test_path }}
      build_projects_json: ${{ matrix.build_projects_json }}
      collect_performance: ${{ matrix.collect_performance }}
      run_preview: ${{ matrix.run_preview }}
      run_tooling: false
      images_prepared: ${{ needs.images.result == 'success' }}
      build_artifact: ${{ needs.build.outputs.artifact }}
  smokes:
    name: Dependent smoke (${{ matrix.runner }})
    needs: [plan, source-checks, layout-tests, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.source-checks.result == 'success' && needs.layout-tests.result == 'success' && needs.plan.outputs.run_smokes == 'true' && (github.event_name != 'pull_request' || needs.build.outputs.artifact != '') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-latest]
    uses: ./.github/workflows/workspace-component-ci.yml
    with:
      suite: SmokeBatch
      qualification_mode: smoke
      suites_json: ${{ needs.plan.outputs.smoke_suites }}
      runner: ${{ matrix.runner }}
      build_artifact: ${{ needs.build.outputs.artifact }}
  tooling-only:
    needs: [plan, source-checks, layout-tests, build]
    # A scripts-only plan skips layout-tests; any other plan still requires it to pass first.
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.source-checks.result == 'success' && (needs.layout-tests.result == 'success' || (needs.layout-tests.result == 'skipped' && needs.plan.outputs.run_layout == 'false')) && needs.plan.outputs.run_tooling == 'true' && (github.event_name != 'pull_request' || needs.plan.outputs.tooling_requires_build == 'false' || needs.build.outputs.artifact != '') }}
    uses: ./.github/workflows/tooling-ci.yml
    with:
      scope: ${{ needs.plan.outputs.tooling_scope }}
      script_tests: ${{ needs.plan.outputs.script_tests }}
      script_mutation_targets: ${{ needs.plan.outputs.script_mutation_targets }}
      mutation_parallel: ${{ needs.plan.outputs.mutation_parallel == 'true' }}
      script_mutation_no_input_cache: ${{ needs.plan.outputs.script_mutation_no_input_cache == 'true' }}
      build_artifact: ${{ needs.build.outputs.artifact }}
  companion-checks:
    needs: [plan, source-checks, layout-tests, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.source-checks.result == 'success' && needs.layout-tests.result == 'success' && needs.plan.outputs.run_companion_checks == 'true' && (github.event_name != 'pull_request' || needs.plan.outputs.run_shared_build == 'false' || needs.build.outputs.artifact != '') }}
    strategy:
      fail-fast: false
      max-parallel: ${{ needs.plan.outputs.mutation_parallel == 'true' && 6 || 1 }}
      matrix: ${{ fromJson(needs.plan.outputs.companion_checks) }}
    uses: ./.github/workflows/workspace-component-ci.yml
    with:
      suite: ${{ matrix.suite }}
      campaign: ${{ matrix.campaign }}
      mutation_parallel: ${{ needs.plan.outputs.mutation_parallel == 'true' }}
      build_artifact: ${{ needs.build.outputs.artifact }}
  distribution:
    needs: [plan, source-checks, layout-tests, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.source-checks.result == 'success' && needs.layout-tests.result == 'success' && needs.plan.outputs.run_distribution == 'true' && (github.event_name != 'pull_request' || needs.build.outputs.artifact != '') }}
    uses: ./.github/workflows/workspace-component-ci.yml
    with:
      suite: Distribution
      build_artifact: ${{ needs.build.outputs.artifact }}
  readytorun:
    needs: [plan, source-checks, layout-tests, images, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.source-checks.result == 'success' && needs.layout-tests.result == 'success' && needs.images.result == 'success' && needs.plan.outputs.run_readytorun == 'true' && (github.event_name != 'pull_request' || needs.build.outputs.artifact != '') }}
    permissions: {contents: read, packages: read}
    uses: ./.github/workflows/quietcli2-readytorun.yml
    with:
      require_complete: true
      images_prepared: true
      build_artifact: ${{ needs.build.outputs.artifact }}
  ci-status:
    name: QuietCli required CI
    needs: [plan, source-checks, layout-tests, build, images, products, smokes, tooling-only, companion-checks, distribution, readytorun]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Require selected scopes and preserve the release check name
        shell: pwsh
        env:
          RESULTS: ${{ toJson(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Assert-CiPlanResults.ps1 -NeedsJson $env:RESULTS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quietcli-ci-plan-results-attempt-${{ github.run_attempt }}
          path: artifacts/ci-plan-results/receipt.json
          if-no-files-found: error
          retention-days: 14
