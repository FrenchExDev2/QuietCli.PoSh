name: QuietCli2 Companions
on:
  pull_request:
    paths: &companion_paths
      - 'FrenchExDev2.QuietCli.*.PoSh/**'
      - 'scripts/**'
      - 'build/**'
      - '.github/**'
      - 'global.json'
      - 'Quietly.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'AGENTS.md'
      - '.gitattributes'
  push:
    branches: [develop]
    paths: *companion_paths
permissions:
  contents: read
jobs:
  companions:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci.yml
    with:
      suite: All
