name: QuietCli2 Git
on:
  pull_request:
    paths: &git_paths
      - 'FrenchExDev2.QuietCli.Git.PoSh/**'
      - 'FrenchExDev2.QuietCli.Git.Tests.PoSh/**'
      - '.github/workflows/git-ci.yml'
      - 'Quietly.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
  push:
    branches: [develop]
    paths: *git_paths
permissions:
  contents: read
jobs:
  git:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci.yml
    with:
      suite: Git
