name: QuietCli2 PR
on:
  workflow_call:
    outputs:
      qualified_sha:
        description: Exact revision accepted by all required qualification jobs
        value: ${{ jobs.qualification-gate.outputs.qualified_sha }}
    inputs:
      build_artifact:
        description: ID of the shared build artifact produced by the PR workflow
        type: string
        default: ''
      build_projects_json:
        type: string
        required: false
        default: '[]'
      qualification_mode:
        type: string
        required: false
        default: full
      solution_path:
        type: string
        required: false
        default: ''
      source_path:
        type: string
        required: false
        default: ''
      test_path:
        type: string
        required: false
        default: ''
      run_preview:
        description: Explicitly add the published next-version Windows preview (optional; production defaults to GA only)
        type: boolean
        required: false
        default: false
      run_tooling:
        description: Require repository automation and run-profile mutation independently of the product matrix
        type: boolean
        required: false
        default: true
      suite:
        type: string
        required: false
        default: All
      collect_performance:
        description: Collect matrix PowerShell/CLR profiling and readable reports (required for Core qualification)
        type: boolean
        required: false
        default: true
      images_prepared:
        description: Use the shared image handoff supplied by the caller of this workflow
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      images_only:
        description: Warm verified Linux image caches on develop without product qualification
        type: boolean
        required: false
        default: false
      build_projects_json:
        type: string
        required: false
        default: '[]'
      qualification_mode:
        type: string
        required: false
        default: full
      solution_path:
        type: string
        required: false
        default: ''
      source_path:
        type: string
        required: false
        default: ''
      test_path:
        type: string
        required: false
        default: ''
      run_preview:
        description: Explicitly add the published next-version Windows preview (optional; production defaults to GA only)
        type: boolean
        required: false
        default: false
      run_tooling:
        description: Require repository automation and run-profile mutation independently of the product matrix
        type: boolean
        required: false
        default: true
      suite:
        description: Declared test suite or All
        type: string
        required: false
        default: All
      collect_performance:
        description: Collect matrix PowerShell/CLR profiling and readable reports (required for Core qualification)
        type: boolean
        required: false
        default: true
permissions:
  contents: read
env:
  QUIETCLI_BUILD_PROJECTS: ${{ inputs.build_projects_json || '[]' }}
  QUIETCLI_SUITE: ${{ inputs.suite || 'All' }}
jobs:
  validate:
    name: Validate component profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize deterministic GitHub environment
        shell: pwsh
        run: ./scripts/Initialize-CiEnvironment.ps1 -Target GitHub -ContainerRuntime docker -Confirm:$false
      - uses: ./.github/actions/cache-resources
      - uses: ./.github/actions/setup-powershell
      - name: Validate mode and catalogue paths without building
        shell: pwsh
        env:
          SUITE: ${{ inputs.suite || 'All' }}
          MODE: ${{ inputs.qualification_mode || 'full' }}
          SOLUTION: ${{ inputs.solution_path }}
          SOURCE: ${{ inputs.source_path }}
          TEST: ${{ inputs.test_path }}
        run: ./scripts/Invoke-ComponentCheck.ps1 -Suite $env:SUITE -QualificationMode $env:MODE -SolutionPath $env:SOLUTION -SourcePath $env:SOURCE -TestPath $env:TEST -ValidateOnly
  component-check:
    needs: validate
    if: inputs.qualification_mode == 'smoke' || inputs.qualification_mode == 'build'
    uses: ./.github/workflows/workspace-component-ci.yml
    with:
      suite: ${{ inputs.suite || 'All' }}
      qualification_mode: ${{ inputs.qualification_mode }}
      solution_path: ${{ inputs.solution_path }}
      source_path: ${{ inputs.source_path }}
      test_path: ${{ inputs.test_path }}
      build_artifact: ${{ inputs.build_artifact }}
  qualification-gate:
    name: QuietCli2 qualification gate
    needs: [linux-matrix, windows, linux-result, performance-results, tooling]
    if: ${{ always() && !inputs.images_only && (inputs.qualification_mode == '' || inputs.qualification_mode == 'full') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      qualified_sha: ${{ steps.gate.outputs.qualified_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Initialize deterministic GitHub environment
        shell: pwsh
        run: ./scripts/Initialize-CiEnvironment.ps1 -Target GitHub -ContainerRuntime docker -Confirm:$false
      - name: Require successful qualification of this exact revision
        id: gate
        shell: pwsh
        env:
          QUIETCLI_SUITE: ${{ inputs.suite || 'All' }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          LINUX_RESULT: ${{ needs.linux-result.result }}
          PERFORMANCE_RESULT: ${{ needs.performance-results.result }}
          TOOLING_WORKFLOW_RESULT: ${{ needs.tooling.result }}
          TOOLING_RESULT: ${{ !inputs.run_tooling && 'skipped' || needs.tooling.outputs.functional_result }}
          TOOLING_MUTATION_RESULT: ${{ !inputs.run_tooling && 'skipped' || needs.tooling.outputs.mutation_result }}
          TOOLING_COMPLETION_RESULT: ${{ !inputs.run_tooling && 'skipped' || needs.tooling.outputs.completion_result }}
          REQUIRE_TOOLING: ${{ inputs.run_tooling }}
        run: |
          # Objective: Fail closed and emit a commit-bound receipt only after every required check succeeds.
          ./scripts/Assert-QualificationGate.ps1 -Suite $env:QUIETCLI_SUITE -Revision $env:GITHUB_SHA -WindowsResult $env:WINDOWS_RESULT -LinuxResult $env:LINUX_RESULT -PerformanceResult $env:PERFORMANCE_RESULT -MutationResult skipped -ToolingWorkflowResult $env:TOOLING_WORKFLOW_RESULT -ToolingResult $env:TOOLING_RESULT -ToolingMutationResult $env:TOOLING_MUTATION_RESULT -ToolingCompletionResult $env:TOOLING_COMPLETION_RESULT -RequireTooling:($env:REQUIRE_TOOLING -ceq 'true') -SkipTty -ReceiptPath ./artifacts/qualification-gate/receipt.json -OutputPath $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ (inputs.suite == '' || inputs.suite == 'All') && 'quietcli2-qualification-gate' || format('quietcli2-qualification-gate-{0}', inputs.suite) }}
          path: artifacts/qualification-gate
  tooling:
    if: inputs.run_tooling && !inputs.images_only && (inputs.qualification_mode == '' || inputs.qualification_mode == 'full')
    uses: ./.github/workflows/tooling-ci.yml
    with:
      build_artifact: ${{ inputs.build_artifact }}
  windows:
    name: Windows (${{ matrix.rid }}, ${{ matrix.channel }}, ${{ matrix.mode }})
    needs: linux-matrix
    if: ${{ !inputs.images_only && (inputs.qualification_mode == '' || inputs.qualification_mode == 'full') }}
    env:
      QUIETCLI_SUITE_HAS_CORE: ${{ needs.linux-matrix.outputs.has_core }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.linux-matrix.outputs.windows_matrix) }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, reviewed upstream reference
        with:
          persist-credentials: false
      - uses: ./.github/actions/cache-test-tools
      - name: Initialize deterministic GitHub environment
        shell: pwsh
        run: ./scripts/Initialize-CiEnvironment.ps1 -Target GitHub -ContainerRuntime docker -Confirm:$false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props
            Directory.Build.props
            global.json
      - uses: ./.github/actions/cache-resources
        with:
          host-channel: ${{ matrix.channel }}
      - name: Verify monorepo structure and external resources
        shell: pwsh
        run: ./scripts/Initialize-Workspace.ps1 -Restore
      - name: Prepare the pinned PowerShell host without installing or changing profiles
        shell: pwsh
        env:
          HOST_CHANNEL: ${{ matrix.channel }}
          HOST_RID: ${{ matrix.rid }}
        run: |
          # Objective: Select the checksum-verified host for every subsequent PowerShell step and child.
          $hostInfo=./scripts/Initialize-PowerShellHost.ps1 -Channel $env:HOST_CHANNEL -RuntimeIdentifier $env:HOST_RID -OutputDirectory (Join-Path $env:RUNNER_TEMP 'quietcli-powershell-host')
          [void][IO.File]::AppendAllTextAsync($env:GITHUB_PATH,($hostInfo.Directory+"`n"),[Text.UTF8Encoding]::new($false)).GetAwaiter().GetResult()
      - name: Fingerprint the selected build closure
        if: inputs.build_artifact == ''
        id: build_key
        shell: pwsh
        env:
          EXPECTED_RID: ${{ matrix.rid }}
        run: ./scripts/Get-CompanionBuildKey.ps1 -Suite $env:QUIETCLI_SUITE -RuntimeIdentifier $env:EXPECTED_RID -ReadyToRun -OutputPath $env:GITHUB_OUTPUT
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.build_artifact == ''
        with:
          path: src/**/lib/
          key: ${{ steps.build_key.outputs.cache_key }}
          restore-keys: ${{ steps.build_key.outputs.cache_prefix }}
      - name: Build all required distributions in Release
        if: inputs.build_artifact == ''
        shell: pwsh
        run: ./scripts/Build-Workspace.ps1 -Project @(ConvertFrom-Json $env:QUIETCLI_BUILD_PROJECTS) -ReuseVerifiedBuild -Suite $env:QUIETCLI_SUITE -Configuration Release -ReadyToRun -RuntimeIdentifier '${{ matrix.rid }}' -ReadyToRunRuntimeIdentifier '${{ matrix.rid }}'
      - uses: ./.github/actions/load-ci-build
        if: inputs.build_artifact != ''
        with:
          artifact: ${{ inputs.build_artifact }}
      - name: Require the shared RID build and restore the selected package graph
        if: inputs.build_artifact != ''
        shell: pwsh
        run: ./scripts/Build-Workspace.ps1 -RequireVerifiedBuild -Suite $env:QUIETCLI_SUITE -ReadyToRun -RuntimeIdentifier '${{ matrix.rid }}' -ReadyToRunRuntimeIdentifier '${{ matrix.rid }}'
      - name: Resolve declared companion qualification controls
        shell: pwsh
        env:
          QUIETCLI_SUITE: ${{ inputs.suite || 'All' }}
        run: ./scripts/Initialize-CiCompanions.ps1 -Suite $env:QUIETCLI_SUITE -RuntimeIdentifier '${{ matrix.rid }}' -RuntimeMajor ${{ matrix.runtime_major }} -EnvironmentPath $env:GITHUB_ENV
      - name: Prepare checksum-pinned PowerShell and CLR profilers
        if: needs.linux-matrix.outputs.has_core == 'true' && inputs.collect_performance
        shell: pwsh
        run: |
          $tools=./scripts/Initialize-Profilers.ps1 -Module profiler,dottrace -OutputDirectory (Join-Path $env:RUNNER_TEMP 'quietcli-profilers')
          $values="QUIETCLI_PROFILER_MODULE=$($tools.ProfilerModulePath)`nQUIETCLI_CLR_PROFILER=$($tools.ClrProfilerPath)`n"
          [void][IO.File]::AppendAllTextAsync($env:GITHUB_ENV,$values,[Text.UTF8Encoding]::new($false)).GetAwaiter().GetResult()
          [void][IO.Directory]::CreateDirectory('./artifacts/tests')
          Copy-Item -LiteralPath $tools.Receipt -Destination ./artifacts/tests/profiler-tools.json
      - name: Run selected suites with mandatory Core integration evidence
        shell: pwsh
        env:
          EXPECTED_RID: ${{ matrix.rid }}
          QUIETCLI_SUITE: ${{ inputs.suite || 'All' }}
          QUIETCLI_EXPECT_ENGINE_MODE: ${{ matrix.mode }}
          QUIETCLI_COLLECT_PERFORMANCE: ${{ inputs.collect_performance }}
          QUIETCLI_EXPECT_HOST_VERSION: ${{ matrix.host_version }}
          QUIETCLI_EXPECT_RUNTIME_MAJOR: ${{ matrix.runtime_major }}
        # Core/All requires fresh imports, diagnostics and owned complex Git states with no Git companion.
        run: |
          $parameters=@{SkipTty=$true;Suite=$env:QUIETCLI_SUITE;ExpectedRuntimeIdentifier=$env:EXPECTED_RID;SkipBuild=$true}
          if($env:QUIETCLI_COLLECT_PERFORMANCE -ceq 'true' -and $env:QUIETCLI_SUITE_HAS_CORE -ceq 'true'){
            $parameters.Profiler=$true;$parameters.ProfilerModulePath=$env:QUIETCLI_PROFILER_MODULE;$parameters.ClrProfilerPath=$env:QUIETCLI_CLR_PROFILER
          }
          ./scripts/Invoke-GitHubCi.ps1 @parameters
      - name: Assemble revision-bound report and trace evidence
        if: always()
        shell: pwsh
        env:
          QUIETCLI_SUITE: ${{ inputs.suite || 'All' }}
          QUIETCLI_COLLECT_PERFORMANCE: ${{ inputs.collect_performance }}
        run: |
          $hostReceipt=Join-Path $env:RUNNER_TEMP 'quietcli-powershell-host/host-receipt.json'
          if(Test-Path $hostReceipt){
            [void][IO.Directory]::CreateDirectory('./artifacts/tests')
            Copy-Item -LiteralPath $hostReceipt -Destination ./artifacts/tests/host-receipt.json
          }
          try {
            ./scripts/New-CoreEvidenceBundle.ps1 -ReportRoot ./artifacts/tests -OutputDirectory ./artifacts/evidence -Revision $env:GITHUB_SHA -RequireProfiling:($env:QUIETCLI_COLLECT_PERFORMANCE -ceq 'true' -and $env:QUIETCLI_SUITE_HAS_CORE -ceq 'true')
          } finally {
            if($env:QUIETCLI_COLLECT_PERFORMANCE -ceq 'true' -and $env:QUIETCLI_SUITE_HAS_CORE -ceq 'true'){
              ./scripts/New-CorePerformanceReport.ps1 -EvidenceRoot ./artifacts/evidence -OutputDirectory ./artifacts/evidence -Revision $env:GITHUB_SHA -Suite $env:QUIETCLI_SUITE
            }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quietcli-core-evidence-${{ matrix.rid }}-${{ matrix.channel }}-${{ matrix.mode }}-${{ github.sha }}-${{ inputs.suite || 'All' }}
          path: artifacts/evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
      - name: Prepare bounded redacted failure diagnostics
        if: failure()
        shell: pwsh
        env:
          QUIETCLI_DIAGNOSTIC_TOKEN: ${{ github.token }}
        run: ./scripts/Export-CiFailureDiagnostics.ps1
      - name: Save redacted Windows failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quietcli-failure-${{ matrix.rid }}-${{ matrix.channel }}-${{ matrix.mode }}-${{ github.sha }}-attempt${{ github.run_attempt }}-${{ inputs.suite || 'All' }}
          path: artifacts/failure-diagnostics
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
  linux-matrix:
    needs: validate
    if: inputs.qualification_mode == '' || inputs.qualification_mode == 'full'
    name: Linux matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_core: ${{ steps.matrix.outputs.has_core }}
      windows_matrix: ${{ steps.windows_matrix.outputs.windows_matrix }}
      expected_reports: ${{ steps.windows_matrix.outputs.expected_reports }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize deterministic GitHub environment
        shell: pwsh
        run: ./scripts/Initialize-CiEnvironment.ps1 -Target GitHub -ContainerRuntime docker -Confirm:$false
      - name: Select locked production hosts and optional next-version preview
        id: windows_matrix
        if: ${{ !inputs.images_only }}
        shell: pwsh
        env:
          INCLUDE_PREVIEW: ${{ inputs.run_preview }}
        run: ./scripts/Select-PowerShellCiMatrix.ps1 -IncludePreview:($env:INCLUDE_PREVIEW -ceq 'true') -OutputPath $env:GITHUB_OUTPUT
      - uses: ./.github/actions/cache-resources
      - name: Define the native Linux platform/RID/runner matrix once for every consumer job
        id: matrix
        shell: pwsh
        env:
          QUIETCLI_SUITE: ${{ inputs.suite || 'All' }}
          QUIETCLI_IMAGES_ONLY: ${{ inputs.images_only }}
        run: |
          Import-Module ./scripts/lib/GitHubCi.psm1 -DisableNameChecking -ErrorAction Stop
          Assert-GitHubCiImagePreparationContext -ImagesOnly:($env:QUIETCLI_IMAGES_ONLY -ceq 'true') -Event $env:GITHUB_EVENT_NAME -Ref $env:GITHUB_REF -Repository $env:GITHUB_REPOSITORY
          ./scripts/Initialize-CiCompanions.ps1 -Suite $env:QUIETCLI_SUITE -OutputPath $env:GITHUB_OUTPUT
          # Objective: single source of truth shared by image and execution jobs,
          # instead of three hand-duplicated YAML copies of the same four native targets.
          $rows=@(
            [ordered]@{platform='debian';rid='linux-x64';runner='ubuntu-latest'},
            [ordered]@{platform='alpine';rid='linux-musl-x64';runner='ubuntu-latest'},
            [ordered]@{platform='debian';rid='linux-arm64';runner='ubuntu-24.04-arm'},
            [ordered]@{platform='alpine';rid='linux-musl-arm64';runner='ubuntu-24.04-arm'}
          )
          $json=(@{include=$rows}|ConvertTo-Json -Depth 4 -Compress)
          [void][IO.File]::AppendAllTextAsync($env:GITHUB_OUTPUT,"matrix=$json`n",[Text.UTF8Encoding]::new($false)).GetAwaiter().GetResult()
  linux-images:
    name: Prepare standalone Linux images
    needs: linux-matrix
    if: ${{ !inputs.images_prepared && (inputs.images_only || inputs.qualification_mode == '' || inputs.qualification_mode == 'full') }}
    permissions: {contents: read, packages: write}
    uses: ./.github/workflows/linux-images.yml
    with:
      suites_json: ${{ format('["{0}"]', inputs.suite || 'All') }}
      artifact_scope: standalone
      publish_cache: ${{ github.repository == 'FrenchExDev2/QuietCli.PoSh' && github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      images_only: ${{ inputs.images_only == true }}
  linux-result:
    name: Linux test driver (${{ matrix.rid }})
    needs: [linux-matrix, linux-images]
    if: ${{ !cancelled() && !inputs.images_only && (inputs.qualification_mode == '' || inputs.qualification_mode == 'full') && needs.linux-matrix.result == 'success' && (needs.linux-images.result == 'success' || (inputs.images_prepared && needs.linux-images.result == 'skipped')) }}
    env:
      QUIETCLI_SUITE_HAS_CORE: ${{ needs.linux-matrix.outputs.has_core }}
    permissions: {contents: read, packages: read}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.linux-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cache-test-tools
      - name: Initialize deterministic GitHub environment
        shell: pwsh
        run: ./scripts/Initialize-CiEnvironment.ps1 -Target GitHub -ContainerRuntime docker -Confirm:$false
      - uses: ./.github/actions/setup-powershell
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: ./.github/actions/cache-resources
      - name: Restore NuGet packages before build and tests
        id: nuget-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ runner.arch }}-quietcli-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props', 'global.json') }}
      - name: Verify monorepo structure and external resources
        shell: pwsh
        run: ./scripts/Initialize-Workspace.ps1 -Restore
      - name: Fingerprint the selected build closure
        if: inputs.build_artifact == ''
        id: build_key
        shell: pwsh
        env:
          EXPECTED_RID: ${{ matrix.rid }}
        run: ./scripts/Get-CompanionBuildKey.ps1 -Suite $env:QUIETCLI_SUITE -RuntimeIdentifier $env:EXPECTED_RID -ReadyToRun -OutputPath $env:GITHUB_OUTPUT
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.build_artifact == ''
        with:
          path: src/**/lib/
          key: ${{ steps.build_key.outputs.cache_key }}
          restore-keys: ${{ steps.build_key.outputs.cache_prefix }}
      - name: Build engines for the six distributions
        if: inputs.build_artifact == ''
        shell: pwsh
        run: ./scripts/Build-Workspace.ps1 -Project @(ConvertFrom-Json $env:QUIETCLI_BUILD_PROJECTS) -ReuseVerifiedBuild -Suite $env:QUIETCLI_SUITE -Configuration Release -ReadyToRun -RuntimeIdentifier '${{ matrix.rid }}' -ReadyToRunRuntimeIdentifier '${{ matrix.rid }}'
      - uses: ./.github/actions/load-ci-build
        if: inputs.build_artifact != ''
        with:
          artifact: ${{ inputs.build_artifact }}
      - name: Require the shared RID build and restore NuGet for offline staging
        if: inputs.build_artifact != ''
        shell: pwsh
        run: ./scripts/Build-Workspace.ps1 -RequireVerifiedBuild -Suite $env:QUIETCLI_SUITE -ReadyToRun -RuntimeIdentifier '${{ matrix.rid }}' -ReadyToRunRuntimeIdentifier '${{ matrix.rid }}'
      - uses: ./.github/actions/load-ci-image-bundle
        id: image
        with:
          suite: ${{ inputs.suite || 'All' }}
          rid: ${{ matrix.rid }}
          artifact_scope: ${{ inputs.images_prepared && 'workspace' || 'standalone' }}
      - name: Load the verified image produced for this run
        shell: pwsh
        env:
          NATIVE_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          [IO.File]::AppendAllText($env:GITHUB_ENV,"QUIETCLI_NATIVE_IMAGE=$env:NATIVE_IMAGE`n",[Text.UTF8Encoding]::new($false))
      - name: Run selected suites and Core integration in the native image
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
          EXPECTED_RID: ${{ matrix.rid }}
          QUIETCLI_SUITE: ${{ inputs.suite || 'All' }}
          QUIETCLI_COLLECT_PERFORMANCE: ${{ inputs.collect_performance }}
        run: |
          # Core/All also requires Core-only controlled Git evidence on every Linux matrix RID.
          $parameters=@{Image=$env:QUIETCLI_NATIVE_IMAGE;Platform=$env:PLATFORM;Suite=$env:QUIETCLI_SUITE;ExpectedRuntimeIdentifier=$env:EXPECTED_RID;SkipBuild=$true;SkipTty=$true;RunDirectory='./artifacts/containers/github-docker'}
          if($env:QUIETCLI_COLLECT_PERFORMANCE -ceq 'true' -and $env:QUIETCLI_SUITE_HAS_CORE -ceq 'true'){
            $tools=./scripts/Initialize-Profilers.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'quietcli-profilers')
            $parameters.Profiler=$true;$parameters.ProfilerModulePath=$tools.ProfilerModulePath;$parameters.ClrProfilerPath=$tools.ClrProfilerPath
          }
          ./scripts/Invoke-GitHubCi.ps1 @parameters
      - name: Assemble revision-bound guest reports and profiling traces
        if: always()
        shell: pwsh
        env:
          QUIETCLI_SUITE: ${{ inputs.suite || 'All' }}
          QUIETCLI_COLLECT_PERFORMANCE: ${{ inputs.collect_performance }}
        run: |
          try {
            ./scripts/New-CoreEvidenceBundle.ps1 -ReportRoot ./artifacts/containers -OutputDirectory ./artifacts/evidence -Revision $env:GITHUB_SHA -RequireProfiling:($env:QUIETCLI_COLLECT_PERFORMANCE -ceq 'true' -and $env:QUIETCLI_SUITE_HAS_CORE -ceq 'true')
          } finally {
            if($env:QUIETCLI_COLLECT_PERFORMANCE -ceq 'true' -and $env:QUIETCLI_SUITE_HAS_CORE -ceq 'true'){
              ./scripts/New-CorePerformanceReport.ps1 -EvidenceRoot ./artifacts/evidence -OutputDirectory ./artifacts/evidence -Revision $env:GITHUB_SHA -Suite $env:QUIETCLI_SUITE
            }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quietcli-core-evidence-${{ matrix.rid }}-Auto-${{ github.sha }}-${{ inputs.suite || 'All' }}
          path: artifacts/evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
      - name: Prepare bounded redacted failure diagnostics
        if: failure()
        shell: pwsh
        env:
          QUIETCLI_DIAGNOSTIC_TOKEN: ${{ github.token }}
        run: ./scripts/Export-CiFailureDiagnostics.ps1
      - name: Save redacted Linux failure diagnostics and image identity
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quietcli-failure-${{ matrix.rid }}-${{ github.sha }}-attempt${{ github.run_attempt }}-${{ inputs.suite || 'All' }}
          path: artifacts/failure-diagnostics
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
      - name: Save NuGet packages using the resolved restore key
        if: ${{ success() && steps.nuget-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}
  performance-results:
    name: Readable performance evidence for the complete matrix
    needs: [linux-matrix, windows, linux-result]
    if: ${{ always() && !inputs.images_only && (inputs.qualification_mode == '' || inputs.qualification_mode == 'full') && inputs.collect_performance && needs.linux-matrix.outputs.has_core == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize deterministic GitHub environment
        shell: pwsh
        run: ./scripts/Initialize-CiEnvironment.ps1 -Target GitHub -ContainerRuntime docker -Confirm:$false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: always()
        with:
          pattern: quietcli-core-evidence-*-${{ inputs.suite || 'All' }}
          path: artifacts/matrix-evidence
          merge-multiple: false
      - name: Render readable results and expose missing matrix evidence
        if: always()
        shell: pwsh
        env:
          QUIETCLI_SUITE: ${{ inputs.suite || 'All' }}
          EXPECTED_REPORTS: ${{ needs.linux-matrix.outputs.expected_reports }}
        run: |
          try {
            ./scripts/New-CorePerformanceReport.ps1 -EvidenceRoot ./artifacts/matrix-evidence -OutputDirectory ./artifacts/performance-results -Revision $env:GITHUB_SHA -ExpectedReports ([int]$env:EXPECTED_REPORTS) -Suite $env:QUIETCLI_SUITE
          } finally {
            $report='./artifacts/performance-results/PERFORMANCES_RESULTS.md'
            if(Test-Path $report){
              $text=[IO.File]::ReadAllTextAsync($report,[Text.Encoding]::UTF8).GetAwaiter().GetResult()
              [void][IO.File]::AppendAllTextAsync($env:GITHUB_STEP_SUMMARY,$text,[Text.UTF8Encoding]::new($false)).GetAwaiter().GetResult()
            }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quietcli-performance-results-${{ github.sha }}-${{ inputs.suite || 'All' }}
          path: artifacts/performance-results
          if-no-files-found: error
          retention-days: 30
