name: QuietCli component build and smoke
on:
  workflow_call:
    inputs:
      build_artifact:
        description: ID of the optional shared PR build artifact
        type: string
        default: ''
      suite:
        type: string
        required: true
      qualification_mode:
        type: string
        default: full
      solution_path:
        type: string
        default: ''
      source_path:
        type: string
        default: ''
      test_path:
        type: string
        default: ''
      suites_json:
        type: string
        default: '[]'
      runner:
        type: string
        default: windows-latest
      campaign:
        type: string
        default: qualification
      mutation_parallel:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize deterministic GitHub environment
        shell: pwsh
        run: ./scripts/Initialize-CiEnvironment.ps1 -Target GitHub -ContainerRuntime docker -Confirm:$false
      - uses: ./.github/actions/cache-resources
      - uses: ./.github/actions/setup-powershell
      - name: Validate declared scope and paths
        shell: pwsh
        env:
          SUITE: ${{ inputs.suite }}
          MODE: ${{ inputs.qualification_mode }}
          SOLUTION: ${{ inputs.solution_path }}
          SOURCE: ${{ inputs.source_path }}
          TEST: ${{ inputs.test_path }}
          SUITES_JSON: ${{ inputs.suites_json }}
          CAMPAIGN: ${{ inputs.campaign }}
        run: ./scripts/Invoke-ComponentCheck.ps1 -Suite $env:SUITE -QualificationMode $env:MODE -SolutionPath $env:SOLUTION -SourcePath $env:SOURCE -TestPath $env:TEST -SuitesJson $env:SUITES_JSON -Campaign $env:CAMPAIGN -ValidateOnly
  tooling:
    needs: validate
    if: inputs.suite == 'Tooling' && inputs.qualification_mode == 'full'
    uses: ./.github/workflows/tooling-ci.yml
    with:
      build_artifact: ${{ inputs.build_artifact }}
  component:
    needs: validate
    if: inputs.suite != 'Tooling' || inputs.qualification_mode != 'full'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Packages.props
            Directory.Build.props
            global.json
      - uses: ./.github/actions/cache-resources
      - uses: ./.github/actions/setup-powershell
      - name: Initialize checkout and restore pinned resources
        shell: pwsh
        run: |
          ./scripts/Initialize-CiEnvironment.ps1 -Target GitHub -ContainerRuntime docker -Confirm:$false
          ./scripts/Initialize-Workspace.ps1 -Restore
      - name: Compute selected build cache key
        if: inputs.build_artifact == ''
        id: build_key
        shell: pwsh
        env:
          SUITE: ${{ inputs.suite }}
          SUITES_JSON: ${{ inputs.suites_json }}
        run: ./scripts/Get-CompanionBuildKey.ps1 -Suite $env:SUITE -SuitesJson $env:SUITES_JSON -OutputPath $env:GITHUB_OUTPUT
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.build_artifact == ''
        with:
          path: src/**/lib/
          key: ${{ steps.build_key.outputs.cache_key }}
          restore-keys: ${{ steps.build_key.outputs.cache_prefix }}
      - uses: ./.github/actions/load-ci-build
        if: inputs.build_artifact != '' && inputs.campaign != 'mutation' && inputs.campaign != 'profiled-mutation'
        with:
          artifact: ${{ inputs.build_artifact }}
      - name: Run the selected component check
        id: campaign
        shell: pwsh
        env:
          SUITE: ${{ inputs.suite }}
          MODE: ${{ inputs.qualification_mode }}
          SOLUTION: ${{ inputs.solution_path }}
          SOURCE: ${{ inputs.source_path }}
          TEST: ${{ inputs.test_path }}
          SUITES_JSON: ${{ inputs.suites_json }}
          CAMPAIGN: ${{ inputs.campaign }}
          MUTATION_PARALLEL: ${{ inputs.mutation_parallel }}
          BUILD_ARTIFACT: ${{ inputs.build_artifact }}
        run: ./scripts/Invoke-ComponentCheck.ps1 -Suite $env:SUITE -QualificationMode $env:MODE -SolutionPath $env:SOLUTION -SourcePath $env:SOURCE -TestPath $env:TEST -SuitesJson $env:SUITES_JSON -Campaign $env:CAMPAIGN -Parallel:($env:MUTATION_PARALLEL -ceq 'true') -RunDirectory ./artifacts/component -SkipBuild:([bool]$env:BUILD_ARTIFACT)
      - name: Render companion campaign results
        if: always() && inputs.campaign != 'qualification' && steps.campaign.outcome != '' && steps.campaign.outcome != 'skipped'
        shell: pwsh
        env:
          SUITE: ${{ inputs.suite }}
          CAMPAIGN: ${{ inputs.campaign }}
          CAMPAIGN_OUTCOME: ${{ steps.campaign.outcome }}
        run: ./scripts/Export-CampaignReport.ps1 -Kind Component -Title "$env:SUITE $env:CAMPAIGN" -Outcome $env:CAMPAIGN_OUTCOME -Directory ./artifacts/component -SummaryPath $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quietcli-component-${{ inputs.suite }}-${{ inputs.qualification_mode }}-${{ inputs.campaign }}-${{ runner.os }}-${{ github.run_attempt }}
          path: artifacts/component
          retention-days: 14
