name: QuietCli2 full Git qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: [self-hosted, linux, x64, podman, kvm]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cache-resources
      - uses: ./.github/actions/setup-powershell
      - name: Verify monorepo structure and external resources
        shell: pwsh
        run: ./scripts/Initialize-Workspace.ps1 -Restore
      - name: Qualify every applicable capability
        shell: pwsh
        env:
          QUIETCLI_QUALIFICATION_CONFIG: ${{ vars.QUIETCLI_QUALIFICATION_CONFIG }}
        run: ./scripts/Invoke-GitQualification.ps1 -ConfigurationPath $env:QUIETCLI_QUALIFICATION_CONFIG
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quietcli2-full-qualification
          path: artifacts/qualification
